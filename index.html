    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }
    .skill-category {
      background: #111827;
      padding: 1.5rem;
      border-radius: 8px;
      border-left: 4px solid #3b82f6;
    }
    .skill-category h3 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      color: #f9fafb;
    }
    .skill-items {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .skill-item {
      background: #374151;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      border: 1px solid #4b5563;
      font-size: 0.75rem;
      font-weight: 500;
      color: #e5e7eb;
      min-width: 2.5rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
    }
    .social-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s;
    }
    .social-link:hover { background: #2563eb; }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
    }
    .link-button {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #10b981;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.3s;
    }
    .link-button:hover { background: #059669; }
    footer {
      text-align: center;
      padding: 2rem 0;
      margin-top: 3rem;
      border-top: 2px solid #374151;
      color: #6b7280;
    }
    footer a { color: #3b82f6; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    @media (max-width: 768px) {
      .container { padding: 1rem; }
      h1 { font-size: 2rem; }
      .skills-grid { grid-template-columns: 1fr; }
    }
